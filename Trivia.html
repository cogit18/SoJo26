<!DOCTYPE html>
<html>
<head>
    <title>SoJo26 | Tournament Trivia</title>
    <link rel="icon" href="images/favicon.svg?v1" type="image/x-icon" />
    <link rel="stylesheet" href="Trivia.css?v1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
</head>
<body>
    <div class="content">
        <img class="center" src="images/Olympic_Rings.svg" alt="Olympic Rings">
        <h1>Opening Ceremony</h1>
        
        <div id="modeScreen">
            <button id="btnPlayLive" class="action-btn" style="background-color: #00529b; color: white; margin-bottom:15px;">Enter Tournament</button>
            <button id="btnPlaySolo" class="action-btn" style="background-color: #555; color: white;">Solo Practice</button>
        </div>

        <div id="setupScreen" style="display: none;">
            <p style="text-align: center;"><b>Select Your Nation:</b></p>
            <div class="team-grid" id="teamSelectionGrid"></div>
            <div id="waitingForGameBtn" style="text-align: center; display: none; font-weight: bold; color: #00529b; padding: 20px;">
                Waiting for Official Start...
            </div>
            <button id="hostStartGameBtn" class="action-btn" style="display: none; background-color: #009f3c; color: white;">Start Tournament</button>
        </div>

        <div id="gameScreen" style="display: none;">
            <div id="preTimerContainer" class="timer-box pre-timer">Next Question in: <span id="preTimerDisplay">5</span>s</div>
            <div id="activeTimerContainer" class="timer-box active-timer" style="display: none;">Time: <span id="timerDisplay">10.0</span>s</div>
            <p id="questionText" class="question-text" style="font-weight: bold; text-align: center; font-size: 1.1em;"></p>
            <div style="text-align: center;">
                <input type="text" id="userAnswer" placeholder="0" readonly>
            </div>
            <div class="keypad">
                <button class="keypad-btn num-key" data-val="1">1</button>
                <button class="keypad-btn num-key" data-val="2">2</button>
                <button class="keypad-btn num-key" data-val="3">3</button>
                <button class="keypad-btn num-key" data-val="4">4</button>
                <button class="keypad-btn num-key" data-val="5">5</button>
                <button class="keypad-btn num-key" data-val="6">6</button>
                <button class="keypad-btn num-key" data-val="7">7</button>
                <button class="keypad-btn num-key" data-val="8">8</button>
                <button class="keypad-btn num-key" data-val="9">9</button>
                <button class="keypad-btn delete-btn" id="keypadDelete">⌫</button>
                <button class="keypad-btn num-key" data-val="0">0</button>
                <button class="keypad-btn submit-btn" id="submitAnswerBtn">Submit</button>
            </div>
        </div>

        <div id="roundResultsScreen" style="display: none; text-align: center;">
            <h2 style="color: #00529b;">Round Results</h2>
            <p id="correctAnswerDisplay" style="font-weight: bold; font-size: 1.2em;"></p>
            <div style="background: #fffbe6; padding: 15px; border-radius: 8px; margin: 15px 0; border: 1px solid #ffe58f;">
                <p id="anecdoteText"></p>
            </div>
            <p>Leaderboard in <span id="autoAdvanceTimer">8</span>s...</p>
        </div>

        <div id="leaderboardScreen" style="display: none;">
            <h2>Tournament Standings</h2>
            <table id="leaderboardTable" width="100%">
                <thead>
                    <tr><th>Score</th><th>Nation</th><th>Guess</th></tr>
                </thead>
                <tbody id="leaderboardBody"></tbody>
            </table>
            <div id="lbAutoAdvanceMsg" style="text-align: center; margin-top: 25px; font-weight: bold;">
                Next Event in <span id="lbAutoAdvanceTimer">8</span>s
            </div>
        </div>

        <div class="wrapper">
            <div class="row">
                <div class="icon"><img src="images/SkiMountaineering.svg"></div>
                <div class="icon"><img src="images/ShortTrackSpeedSkating.svg"></div>
                <div class="icon"><img src="images/Snowboard.svg"></div>
                <div class="icon"><img src="images/Skeleton.svg"></div>
                <div class="icon"><img src="images/Curling.svg"></div>
                <div class="icon"><img src="images/Biathlon.svg"></div>
                <div class="icon"><img src="images/FreestyleSkiing.svg"></div>
            </div>
        </div>
    </div>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="Trivia.js?v1"></script>
</body>
</html>
