<!DOCTYPE html>
<html>
<head>
    <title>SoJo26 | Opening Ceremony</title>
    <link rel="icon" href="images/favicon.svg?v1" type="image/x-icon" />
    <link rel="stylesheet" href="Trivia.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
</head>
<body>
    <div class="content">
        <img class="center" src="images/Olympic_Rings.svg" alt="Olympic Rings">
        <h1>Tournament Trivia</h1>
        
        <div id="modeScreen">
            <p style="text-align: center;">Choose your game mode:</p>
            <button id="btnPlayLive" class="action-btn">Multiplayer Tournament</button>
            <button id="btnPlaySolo" class="action-btn" style="background-color: #555;">Solo Practice</button>
        </div>

        <div id="setupScreen" style="display: none;">
            <p style="text-align: center;">Select your Nation:</p>
            <div class="team-grid" id="teamSelectionGrid"></div>
            <div id="waitingForGameBtn" style="text-align: center; display: none; font-weight: bold; color: #00529b;">
                Waiting for Official Start...
            </div>
            <button id="hostStartGameBtn" class="action-btn" style="display: none; background-color: #009f3c;">Start Tournament</button>
        </div>

        <div id="gameScreen" style="display: none;">
            <div id="preTimerContainer" class="timer-box pre-timer">Question starts in: <span id="preTimerDisplay">5</span>s</div>
            <div id="activeTimerContainer" class="timer-box active-timer" style="display: none;">Time: <span id="timerDisplay">10.0</span>s</div>
            <p id="questionText" class="question-text"></p>
            <div style="text-align: center;">
                <input type="text" id="userAnswer" placeholder="0" readonly disabled>
            </div>
            <div class="keypad">
                <button class="keypad-btn num-key" data-val="1">1</button>
                <button class="keypad-btn num-key" data-val="2">2</button>
                <button class="keypad-btn num-key" data-val="3">3</button>
                <button class="keypad-btn num-key" data-val="4">4</button>
                <button class="keypad-btn num-key" data-val="5">5</button>
                <button class="keypad-btn num-key" data-val="6">6</button>
                <button class="keypad-btn num-key" data-val="7">7</button>
                <button class="keypad-btn num-key" data-val="8">8</button>
                <button class="keypad-btn num-key" data-val="9">9</button>
                <button class="keypad-btn delete-btn" id="keypadDelete">⌫</button>
                <button class="keypad-btn num-key" data-val="0">0</button>
                <button class="keypad-btn submit-btn" id="submitAnswerBtn">Submit</button>
            </div>
        </div>

        <div id="roundResultsScreen" style="display: none; text-align: center;">
            <h2>Round Review</h2>
            <p id="correctAnswerDisplay" class="results-correct-ans"></p>
            <div class="anecdote-container"><p id="anecdoteText"></p></div>
            <div id="autoAdvanceMsg">Standings in <span id="autoAdvanceTimer">10</span>s</div>
        </div>

        <div id="leaderboardScreen" style="display: none;">
            <h2>Tournament Standings</h2>
            <table id="leaderboardTable" width="100%">
                <thead>
                    <tr><th>Score</th><th>Nation</th><th>Last Guess</th></tr>
                </thead>
                <tbody id="leaderboardBody"></tbody>
            </table>
            <div id="lbAutoAdvanceMsg" style="text-align: center; margin-top: 20px; font-weight: bold;">
                Next Event in <span id="lbAutoAdvanceTimer">10</span>s
            </div>
        </div>
    </div>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="Trivia.js"></script>
</body>
</html>
